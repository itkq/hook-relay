name: aqua

permissions: {}

on:
  pull_request:
    branches: ["main"]
    paths:
      - aqua.yaml
      - aqua-checksums.json
      - .github/workflows/aqua.yml

jobs:
  aqua:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
    - uses: actions/create-github-app-token@v1.11.6
      id: app-token
      with:
        app-id: ${{ vars.TAGPR_GITHUB_APP_ID }}
        private-key: ${{ secrets.TAGPR_GITHUB_APP_PRIVATE_KEY }}
    - uses: actions/checkout@v4.2.2
      with:
        token: ${{ steps.app-token.outputs.token }}
        persist-credentials: false
    - uses: aquaproj/aqua-installer@v4.0.2
      with:
        aqua_version: v2.57.2
    - uses: aquaproj/update-checksum-action@v0.2.2
      with:
        prune: true
      env:
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
